<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📝 My Blog</h1>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#posts">Posts</a></li>
                <li id="auth-link"><a href="#login">Login</a></li>
                <li id="logout-link" style="display:none;"><a href="#logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Hero Section -->
        <section class="hero">
            <h1>Welcome to My Blog</h1>
            <p>Sharing stories, insights, and ideas</p>
        </section>

        <!-- Posts Section -->
        <section class="posts-section">
            <h2>Latest Posts</h2>
            <div id="posts-list" class="posts-grid">
                <p>Loading posts...</p>
            </div>
        </section>

        <!-- Create Post Form (Hidden initially) -->
        <section id="create-post-section" class="create-post-section" style="display:none;">
            <h2>Create New Post</h2>
            <form id="post-form">
                <input type="text" id="post-title" placeholder="Post Title" required>
                <textarea id="post-content" placeholder="Post Content" required></textarea>
                <button type="submit">Create Post</button>
            </form>
        </section>

        <!-- Login Form (Hidden initially) -->
        <section id="login-section" class="login-section" style="display:none;">
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
