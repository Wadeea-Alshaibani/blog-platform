name: Blog Platform CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        run: cd backend && npm install
      
      - name: Test backend syntax
        run: cd backend && node -c app.js
      
      - name: Health check simulation
        run: echo "✅ Blog Platform CI/CD Pipeline Ready!"